# Nav2 parameters for the Lunabot rover.
#
# ==================== UNTUNED ====================
# `nav:=true` starts this stack, and the frame names, the footprint and the
# velocity limits agree with the rest of the workspace -- lunabot_navigation's
# tests enforce that rather than trusting the comments below.
#
# What has NOT happened is a rover navigating anywhere. Nothing here has been
# tuned against a real costmap or a real path. Expect to spend real time on
# the controller and the costmaps. See docs/NAVIGATION.md for the first-run
# checklist and the order to attack the tuning in.
# =================================================
#
# Every ros__parameters block below states `use_sim_time`, including the ones
# where it looks redundant. navigation.launch.py rewrites the value through
# nav2_common's RewrittenYaml, which REPLACES existing keys and does not add
# missing ones -- a block without the key silently keeps the wall clock under
# hw:=sim.
#
# The parts most likely to need rethinking for this robot:
#
#   - The rover is SKID-STEER with fabricated odometry (no encoders). Nav2's
#     controllers assume the robot goes where it is told. It does not.
#   - The only obstacle sensor is a camera clipped at 2 m and tilted down.
#     The costmap's observation range cannot exceed what the sensor measures.
#   - Regolith traversability is not a binary. A slope the rover can climb
#     empty may be impassable loaded.

amcl:
  ros__parameters:
    # Present for completeness only. The rover localises with SLAM
    # (rtabmap owns map -> odom), not AMCL against a static map. Running both
    # would put two publishers on map -> odom.
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan


bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    # ms a server gets to ACKNOWLEDGE a request before the tree gives up on
    # the whole goal. Nav2's 20 ms default aborted the first sim goal mid-
    # drive ("Timed out while waiting for action server to acknowledge goal
    # request for compute_path_to_pose") with Isaac and rtabmap loading the
    # CPU; so did 200 ms, for follow_path (load 12 on 16 threads). A Jetson
    # under SLAM load is no better. The only cost of 1 s is noticing a dead
    # server a second later.
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    # Our trees (config/navigate_*.xml): replan every 10 s or when the path
    # goes invalid, and only the recoveries behavior_server runs. BOTH must
    # be set: bt_navigator loads the through-poses tree at configure too.
    # The values are placeholders: navigation.launch.py rewrites them to the
    # installed absolute paths.
    default_nav_to_pose_bt_xml: "navigate_to_pose.xml"
    default_nav_through_poses_bt_xml: "navigate_through_poses.xml"


controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0

    # TwistStamped, not Twist. twist_mux runs with use_stamped: true because
    # Jazzy's diff_drive_controller subscribes to TwistStamped, and a mismatch
    # here is the failure docs/TOPIC_FRAME_CONTRACT.md warns about: the topics
    # connect, nothing errors, and the rover does not move.
    #
    # VERIFY against the installed Nav2. This parameter arrived in Jazzy and
    # is expected to disappear again once stamped commands are the only
    # option.
    enable_stamped_cmd_vel: true

    # Anything below this counts as stopped. Set generously because a
    # skid-steer scrubbing on regolith reports motion it is not making.
    min_x_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.10

    # A K-turn stops at every cusp, so "no progress for 10 s" (the default)
    # trips mid-manoeuvre.
    progress_checker_plugins: ["progress_checker"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0

    # RPP turns on the spot to the goal heading at the end, so yaw can be
    # held reasonably tight now that the rover pivots.
    goal_checker_plugins: ["goal_checker"]
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.3
      stateful: true

    # Nav2's output. twist_mux arbitrates between this and teleop, and teleop
    # wins -- see lunabot_bringup/config/twist_mux.yaml.
    controller_plugins: ["FollowPath"]

    FollowPath:
      # Regulated Pure Pursuit, turning on the spot to face the path first.
      # The six-wheel drop-centre pivots (lunabot_sim/robot/soil.py, Isaac
      # turn tests: ~99% of commanded yaw rate on rigid ground), so this is
      # the ordinary differential-drive setup. Driving forward only also keeps
      # the forward camera looking where the rover goes.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # The 2027 design's top speed. MUST stay within diff_drive_controller's
      # limits in lunabot_bringup/config/controllers.yaml, and equal to the
      # smoother's below (tests enforce both).
      desired_linear_vel: 0.3

      # Pure pursuit steers at a point this far down the path. Too short and
      # it weaves; too long and it cuts corners into obstacles. Short here:
      # the lattice planner threads gaps with ~10 cm to spare, and at 0.6 m
      # the arc cut inside the planned path and the collision check stopped
      # the rover 28 times in one mission (Isaac, UCF lane, seed 7).
      lookahead_dist: 0.45
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true

      # Turn in place to face the path whenever it heads off more than 45 deg.
      # Nav2 refuses rotate-to-heading together with allow_reversing.
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 0.6  # under the design's 0.7 rad/s
      max_angular_accel: 2.0
      allow_reversing: false

      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.10
      use_cost_regulated_linear_velocity_scaling: false

      # Above min_x_velocity_threshold, or the last few cm never happen.
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.6

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      transform_tolerance: 0.2
      interpolate_curvature_after_goal: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true

      # 4 m window with a 2 m sensor. Deliberately larger than the sensor
      # range so the rover retains a short memory of obstacles that have
      # passed out of view -- which matters when the only camera faces
      # forward and the rover reverses.
      width: 4
      height: 4
      resolution: 0.05

      # The box that holds the chassis AND the wheels (properties.xacro):
      # whichever reaches further. Tested against the xacro.
      #
      # NOT the 0.59 m circle a pivot sweeps. That was tried: it made the
      # rover 1.18 m wide to the planner, and the UCF lane's rock field --
      # gaps of 0.65-0.95 m that the real 0.64 m-wide rover drives through
      # -- became impassable. Pivots are made safe by the follower instead:
      # Regulated Pure Pursuit projects this footprint through every
      # rotate-to-heading and stops rather than swing into a rock
      # (use_collision_detection).
      #
      # The 2027 design's drum reaches further forward still -- grow this
      # when the description models it.
      footprint: "[[0.46, 0.322], [0.46, -0.322], [-0.46, -0.322], [-0.46, 0.322]]"
      footprint_padding: 0.03

      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        # 2D ObstacleLayer, NOT VoxelLayer. With clearing off (below) the
        # voxel grid's only advantage -- clearing in 3D -- is gone, and in
        # Isaac it would not mark low rocks at all: the camera cloud held
        # ~29000 points on a 12 cm rock 0.7 m ahead, above every threshold,
        # and the voxel layer left the cell unmarked while the rover drove
        # into it. This layer marks every point between the height limits.
        plugin: "nav2_costmap_2d::ObstacleLayer"
        # BOTH levels: the layer has its own min_obstacle_height, default
        # 0.0, applied on top of the source's -- it silently dropped every
        # point below the axle whatever the source said (found by reading
        # the voxel grid: nothing was ever marked below z = 0).
        min_obstacle_height: -0.10
        max_obstacle_height: 0.60
        observation_sources: pointcloud
        pointcloud:
          topic: /oak_d/points
          data_type: "PointCloud2"
          # Both bounded by the camera's 2 m depth clip. Claiming more range
          # than the sensor has means clearing space that was never observed.
          obstacle_max_range: 2.0
          raytrace_max_range: 2.0
          # Heights are in the costmap's frame, where z = 0 is base_link: the
          # AXLE, 0.15 m (wheel_radius) above the ground, ~0.18 m with the
          # wheels sunk in. With +0.05 here every rock shorter than ~20 cm
          # was invisible and the rover drove into them. -0.10 = ~8 cm above
          # the ground. Tested against wheel_radius.
          min_obstacle_height: -0.10
          max_obstacle_height: 0.60
          marking: true
          # NO clearing here either. A low rock drops into the camera's near
          # blind zone (~0.65 m from the rover's centre) as the rover closes
          # in, and clearing rays to the ground beyond it then erase it --
          # exactly when Regulated Pure Pursuit's collision check needs it.
          # In Isaac the rover drove into rocks it had marked a second
          # earlier. Arena rocks only move when pushed, and the 4 m rolling
          # window drops what the rover leaves behind. Cost on real hardware:
          # depth-noise speckles also persist inside the window; the 8 cm
          # threshold and 2 m range keep that down.
          clearing: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # >= the padded footprint's circumscribed radius (0.60 m), so cost
        # rises before any corner can reach a rock, including mid-pivot.
        inflation_radius: 0.75
        cost_scaling_factor: 3.0


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true

      # A ROLLING window, not one sized by the static layer. Sized by
      # rtabmap's /map, the costmap only covers what the camera has seen --
      # about 2 m at the start -- and a goal across the arena is rejected as
      # GOAL_OUTSIDE_MAP (planner error 204) before anything is planned. 16 m
      # covers a whole competition arena (8.14 m x 4.57 m UCF lane) from
      # anywhere inside it; the static layer still copies rtabmap's map in.
      rolling_window: true
      width: 16
      height: 16

      # Same footprint as local_costmap: see there.
      footprint: "[[0.46, 0.322], [0.46, -0.322], [-0.46, -0.322], [-0.46, 0.322]]"
      footprint_padding: 0.03

      plugins: ["static_layer", "obstacle_layer", "unseen_shadow_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # rtabmap's occupancy grid, not a map_server. Grid/3D is false in
        # rtabmap.yaml specifically so this layer has something to consume.
        map_subscribe_transient_local: true

      obstacle_layer:
        # 2D ObstacleLayer, NOT VoxelLayer. With clearing off (below) the
        # voxel grid's only advantage -- clearing in 3D -- is gone, and in
        # Isaac it would not mark low rocks at all: the camera cloud held
        # ~29000 points on a 12 cm rock 0.7 m ahead, above every threshold,
        # and the voxel layer left the cell unmarked while the rover drove
        # into it. This layer marks every point between the height limits.
        plugin: "nav2_costmap_2d::ObstacleLayer"
        # BOTH levels: the layer has its own min_obstacle_height, default
        # 0.0, applied on top of the source's -- it silently dropped every
        # point below the axle whatever the source said (found by reading
        # the voxel grid: nothing was ever marked below z = 0).
        min_obstacle_height: -0.10
        max_obstacle_height: 0.60
        observation_sources: pointcloud
        pointcloud:
          topic: /oak_d/points
          data_type: "PointCloud2"
          obstacle_max_range: 2.0
          raytrace_max_range: 2.0
          # Heights are in the costmap's frame, where z = 0 is base_link: the
          # AXLE, 0.15 m (wheel_radius) above the ground, ~0.18 m with the
          # wheels sunk in. With +0.05 here every rock shorter than ~20 cm
          # was invisible and the rover drove into them. -0.10 = ~8 cm above
          # the ground. Tested against wheel_radius.
          min_obstacle_height: -0.10
          max_obstacle_height: 0.60
          marking: true
          # NO clearing in the global costmap: it remembers every rock it
          # has seen for the whole run. Clearing rays to the ground just
          # behind a LOW rock pass through the voxel holding its top, so once
          # the rock dropped below the camera's view as the rover closed in,
          # it was erased and the planner drove straight over a 10 cm cube.
          # Arena rocks do not move by themselves. The local costmap still
          # clears, so transient noise near the rover goes away.
          clearing: false

      unseen_shadow_layer:
        # The camera marks only the faces of a rock turned towards it; behind
        # them nothing was ever seen. Left alone, the inflation layer turns
        # those unknown cells into 253 ("inscribed"), which Smac's footprint
        # check lets the rover's outline cross -- plans clipped the unseen
        # corners of rocks and the rover passed at 0-4 cm, sometimes
        # touching. This marks unknown cells reachable from a lethal cell
        # through unknown cells only, up to shadow_depth, as lethal. Seen-free
        # cells stop it, so nothing is ever marked in front of a seen surface
        # (the back wall is 0.75 m from the start pose), and far unknown
        # space stays unknown, so goals beyond the camera still plan. No
        # shape guess: one depth, the deepest rock (30-40 cm). BEFORE
        # inflation, so the shadows are inflated too. src/unseen_shadow_layer.cpp
        plugin: "lunabot_navigation::UnseenShadowLayer"
        shadow_depth: 0.45

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # >= the padded footprint's circumscribed radius (0.60 m), which
        # lets Smac collision-check by centre cost and only fall back to the
        # full footprint near obstacles. Well beyond it, so cost keeps
        # falling off past the footprint and Hybrid-A* leaves room: a rover
        # that cannot turn quickly lags its path, and a path that grazes the
        # inscribed zone has the follower stop for "collision ahead".
        inflation_radius: 1.0
        # Gentler fall-off: cost stays high further from rocks, so paths keep
        # to the middle of gaps rather than skimming one side.
        cost_scaling_factor: 2.0


planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      # Smac STATE LATTICE: plans position AND heading with differential-drive
      # motion primitives -- arcs, straights and rotations in place -- and
      # collision-checks the real rectangular footprint at every step. So it
      # plans a pivot only where the rover can actually pivot, and threads
      # gaps lengthwise where it cannot.
      #
      # Smac 2D (a point planner) was tried first: in the UCF lane's rock
      # field it routed into gaps the rover could only enter by pivoting
      # where a pivot did not fit, and the rover stalled at the entrance,
      # clipping a boulder. Before that, Hybrid-A* with Reeds-Shepp at 1.5 m
      # was the setup for the four-wheeler that could not pivot (c1b4379).
      plugin: "nav2_smac_planner::SmacPlannerLattice"
      # Nav2's sample primitives for a differential drive at 5 cm (the
      # global costmap's resolution, tested). Placeholder: navigation.launch.py
      # rewrites it to the installed absolute path.
      lattice_filepath: "5cm_resolution/0.5m_turning_radius/diff/output.json"
      allow_reverse_expansion: false  # forward only: the camera faces forward
      rotation_penalty: 3.0           # pivots cost something, not everything
      reverse_penalty: 2.0
      change_penalty: 0.05
      non_straight_penalty: 1.05
      cost_penalty: 3.0
      retrospective_penalty: 0.015
      tolerance: 0.30
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      debug_visualizations: false

      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2


behavior_server:
  ros__parameters:
    use_sim_time: false
    # Recoveries publish velocity too, and they publish it through the
    # smoother. Same reasoning as controller_server above.
    enable_stamped_cmd_vel: true
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    # Spin is back with the six-wheel drop-centre: turning in place is what
    # lets the forward-only camera look around after a failure. Every
    # behaviour a tree calls must be listed here, or Nav2 does not start
    # (tested).
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    # Slow enough that visual odometry and rtabmap keep tracking through a
    # turn: the initial survey and Spin recoveries both use these.
    max_rotational_vel: 0.4
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0


velocity_smoother:
  ros__parameters:
    use_sim_time: false
    # The last node in the chain, so this is the one that actually decides
    # what type /cmd_vel_nav carries. The other two matter because the
    # smoother has to be able to read what they send it.
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    feedback: "OPEN_LOOP"
    # Reverse only ever comes from the BackUp recovery now (0.10 m/s).
    max_velocity: [0.3, 0.0, 0.7]
    min_velocity: [-0.15, 0.0, -0.7]
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: /odom
    odom_duration: 0.1


curvature_limiter:
  ros__parameters:
    use_sim_time: false
    # 0 = pass everything through: the six-wheel drop-centre turns on the
    # spot. It stays in the chain so the four-wheel behaviour can be put back
    # with one number if the pivot fails in the field: 1.0 m was right for
    # the four-wheeler (commanded 1.0 m drove ~1.5 m; tighter stalled with
    # the wheels spinning). See scripts/curvature_limiter.py.
    min_turning_radius: 0.0
