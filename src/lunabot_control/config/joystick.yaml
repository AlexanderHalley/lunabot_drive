# Nintendo Switch Pro teleop (carried over from 2026 config/switch_pro.yaml).
# NOTE: now publishes to /cmd_vel_joy (via twist_mux), not directly to /cmd_vel.
teleop_twist_joy_node:
  ros__parameters:
    enable_button: 5          # R button (hold to drive) -- safety, kept from 2026
    require_enable_button: true
    enable_turbo_button: 4    # L button

    axis_linear:
      x: 1                    # left stick Y
    scale_linear:
      x: 0.8
    scale_linear_turbo:
      x: 1.0

    axis_angular:
      yaw: 0                  # right stick X
    scale_angular:
      yaw: 2.0
    scale_angular_turbo:
      yaw: 3.0
