# Arbitrates between velocity command sources.
#
# There was no mux on the 2026 robot: teleop published straight to /cmd_vel,
# which is fine right up to the moment a second source exists. With Nav2
# arriving, something has to decide who wins, and "whoever published last"
# is not a decision.
#
# Higher priority wins. A source is considered active only while it is
# publishing within its timeout, so a stalled node releases the bus.

twist_mux:
  ros__parameters:
    # VERIFY on first bring-up: if diff_drive_controller subscribes to
    # TwistStamped (Jazzy does), twist_mux must publish the same type or the
    # topic connects with zero subscribers and the rover silently does not
    # move. See docs/TOPIC_FRAME_CONTRACT.md.
    use_stamped: true

    topics:
      # Teleop outranks navigation, always. A human reaching for the
      # controller is a human who wants the rover to stop doing what it is
      # doing, and the deadman means teleop only holds the bus while the
      # button is held.
      joystick:
        topic: cmd_vel_joy
        timeout: 0.5
        priority: 100

      navigation:
        topic: cmd_vel_nav
        timeout: 0.5
        priority: 10

    # The software e-stop: while /e_stop last said true, every source below
    # priority 255 -- all of them, teleop included -- is cut off. twist_mux
    # then publishes nothing, and diff_drive_controller's cmd_vel_timeout
    # (0.5 s, controllers.yaml) stops the wheels. mission.py listens to the
    # same topic and pauses, so releasing it does not drive off: resume does.
    #
    # timeout 0: latching, not a heartbeat. A heartbeat lock (no message for
    # N s = locked) is the safer design for a radio link, but nothing
    # publishes one yet, and with it on, the autonomous run in the sim would
    # sit locked. This is NOT the competition e-stop, which is the physical
    # button cutting power; it is the operator's first, gentler stop.
    locks:
      e_stop:
        topic: e_stop
        timeout: 0.0
        priority: 255
