boulder_detector:
  ros__parameters:
    # Everything is reasoned about in base_link: X forward, Y left, Z up.
    # The cloud arrives in the camera's optical frame and is transformed
    # before anything else happens, which is the only way the numbers below
    # are comprehensible.
    output_frame: base_link

    # 3 cm voxels. Everything after this is O(n), so this is the single
    # biggest lever on CPU cost. Too coarse and small rocks vanish; the
    # smallest boulder we claim to detect is 5 cm, so 3 cm is about the
    # largest leaf that still leaves a few points on one.
    voxel_leaf_size: 0.03

    # ==================== Region of interest ====================
    # [x, y, z] in base_link, metres.
    #
    # x starts at 0.2 to exclude the rover's own front face. It ends at 2.5
    # because the camera clips depth at 2 m -- anything past that is stereo
    # noise, not measurement.
    #
    # z starts at -0.5 rather than at the ground, so that below-ground points
    # survive into the crater cloud once craters exist.
    roi_min: [0.2, -1.5, -0.5]
    roi_max: [2.5, 1.5, 1.0]

    # ==================== Ground ====================
    # Nominal height of the ground plane in base_link. base_link sits one
    # wheel radius above the ground by construction, so this is -wheel_radius.
    #
    # KEEP IN SYNC with wheel_radius in properties.xacro and controllers.yaml.
    # A third copy of the same number, and the only one that is a plain
    # threshold rather than a kinematic constant.
    #
    # With ground_fit_plane on, this is NOT the classification threshold. It
    # is the prior: the plane used if the fit is rejected, and the value the
    # fit is sanity-checked against. Getting it wrong by a few centimetres no
    # longer breaks the detector.
    ground_z: -0.10

    # Points within 5 cm of the ground plane are ground. Perpendicular
    # distance to the plane, so on a slope this still means "on the ground"
    # rather than "at about the right height".
    #
    # Doubles as the RANSAC inlier threshold, which is the right coupling:
    # a point close enough to the plane to be an inlier is a point close
    # enough to be ground.
    ground_plane_distance_threshold: 0.05

    # Fit the plane to each cloud instead of assuming it is level at
    # ground_z. Off is the old behaviour, and is the thing to try first if
    # the detector starts reporting the floor -- a bad fit is worse than no
    # fit, and the detector says which one it used at startup and warns,
    # throttled, on every frame it falls back.
    ground_fit_plane: true

    # Reject a fit tilted more than this from horizontal. Sized for a plane
    # the ROVER IS ON: at 15 degrees the rover is close to the limit of what
    # it can climb anyway, and anything steeper in view is a berm face or a
    # crater wall, which are exactly the things that must not be mistaken for
    # the floor.
    ground_max_slope_degrees: 15.0

    # RANSAC iterations. The ground is normally the large majority of the
    # cropped cloud, so this finds it with room to spare -- a cost ceiling
    # rather than a tuning knob.
    ground_max_iterations: 100

    # Reject a fit supported by less than this fraction of the cloud. The
    # guard against fitting the flat top of a large rock. Raise it if the
    # detector latches onto boulder faces; lower it if it falls back to level
    # whenever the view fills with obstacles.
    ground_min_inlier_fraction: 0.25

    # Reject a fit whose height under base_link differs from ground_z by more
    # than this. DELIBERATELY LOOSE -- it is a sanity bound, not a second
    # threshold. Tighten it towards ground_plane_distance_threshold and the
    # fit loses the ability to correct ground_z, which is most of the reason
    # to fit at all.
    ground_max_height_deviation: 0.30

    # ==================== Clustering ====================
    # Points more than 10 cm apart are different objects. At 2 m the stereo
    # point spacing is already several centimetres, so going much below this
    # splits single boulders into several.
    cluster_tolerance: 0.10

    # 20 points minimum. Below that it is stereo speckle. This interacts with
    # voxel_leaf_size and with range: a 10 cm rock at 2 m may only be a
    # couple of dozen points before downsampling.
    min_cluster_size: 20
    max_cluster_size: 25000

    # ==================== Size filter ====================
    # PLACEHOLDERS until the competition's obstacle spec is known.
    min_boulder_dimension: 0.05
    max_boulder_dimension: 1.50

    # A patch that is wide but flat is a texture change, not an obstacle.
    min_boulder_height: 0.03

    # ==================== Output ====================
    # CONSTANT, and deliberately not called a confidence. Nothing in this
    # pipeline estimates one. A varying number here would imply a classifier
    # that does not exist, and downstream code would start trusting it.
    detection_score: 0.5

    # Debug clouds and markers are published lazily -- only when something is
    # subscribed -- so leaving this on costs nothing until RViz connects.
    publish_debug_clouds: true
