# Nav2 parameters for the Lunabot rover.
#
# ==================== UNTUNED ====================
# `nav:=true` starts this stack, and the frame names, the footprint and the
# velocity limits agree with the rest of the workspace -- lunabot_navigation's
# tests enforce that rather than trusting the comments below.
#
# What has NOT happened is a rover navigating anywhere. Nothing here has been
# tuned against a real costmap or a real path. Expect to spend real time on
# the controller and the costmaps. See docs/NAVIGATION.md for the first-run
# checklist and the order to attack the tuning in.
# =================================================
#
# Every ros__parameters block below states `use_sim_time`, including the ones
# where it looks redundant. navigation.launch.py rewrites the value through
# nav2_common's RewrittenYaml, which REPLACES existing keys and does not add
# missing ones -- a block without the key silently keeps the wall clock under
# hw:=sim.
#
# The parts most likely to need rethinking for this robot:
#
#   - The rover is SKID-STEER with fabricated odometry (no encoders). Nav2's
#     controllers assume the robot goes where it is told. It does not.
#   - The only obstacle sensor is a camera clipped at 2 m and tilted down.
#     The costmap's observation range cannot exceed what the sensor measures.
#   - Regolith traversability is not a binary. A slope the rover can climb
#     empty may be impassable loaded.

amcl:
  ros__parameters:
    # Present for completeness only. The rover localises with SLAM
    # (rtabmap owns map -> odom), not AMCL against a static map. Running both
    # would put two publishers on map -> odom.
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan


bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20


controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0

    # TwistStamped, not Twist. twist_mux runs with use_stamped: true because
    # Jazzy's diff_drive_controller subscribes to TwistStamped, and a mismatch
    # here is the failure docs/TOPIC_FRAME_CONTRACT.md warns about: the topics
    # connect, nothing errors, and the rover does not move.
    #
    # VERIFY against the installed Nav2. This parameter arrived in Jazzy and
    # is expected to disappear again once stamped commands are the only
    # option.
    enable_stamped_cmd_vel: true

    # Anything below this counts as stopped. Set generously because a
    # skid-steer scrubbing on regolith reports motion it is not making.
    min_x_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.10

    # Nav2's output. twist_mux arbitrates between this and teleop, and teleop
    # wins -- see lunabot_bringup/config/twist_mux.yaml.
    controller_plugins: ["FollowPath"]

    FollowPath:
      # DWB. Chosen as a starting point because it is well understood, not
      # because it is right for this robot: its motion model assumes commanded
      # velocity is achieved, which on loose regolith it is not. Regulated
      # Pure Pursuit is the obvious alternative to evaluate.
      plugin: "dwb_core::DWBLocalPlanner"

      # MUST stay consistent with diff_drive_controller's limits in
      # lunabot_bringup/config/controllers.yaml. Nav2 commanding beyond what
      # the controller will accept produces silent clamping and a robot that
      # does not follow its plan.
      max_vel_x: 0.5
      min_vel_x: -0.2
      max_vel_theta: 1.0
      min_speed_theta: -1.0
      acc_lim_x: 1.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.0
      decel_lim_theta: -2.0

      # Skid-steer: no lateral motion at all.
      max_vel_y: 0.0
      min_vel_y: 0.0
      acc_lim_y: 0.0

      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.30
      # Rotating in place is expensive on regolith -- it scrubs, throws up
      # dust, and produces the worst possible odometry. Prefer arcs.
      stateful: true


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true

      # 4 m window with a 2 m sensor. Deliberately larger than the sensor
      # range so the rover retains a short memory of obstacles that have
      # passed out of view -- which matters when the only camera faces
      # forward and the rover reverses.
      width: 4
      height: 4
      resolution: 0.05

      # PLACEHOLDER, from properties.xacro: 0.70 x 0.40 chassis. Update both
      # together. A footprint smaller than the robot is how rovers get wedged.
      footprint: "[[0.35, 0.20], [0.35, -0.20], [-0.35, -0.20], [-0.35, 0.20]]"
      footprint_padding: 0.05

      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        observation_sources: pointcloud
        pointcloud:
          topic: /oak_d/points
          data_type: "PointCloud2"
          # Both bounded by the camera's 2 m depth clip. Claiming more range
          # than the sensor has means clearing space that was never observed.
          obstacle_max_range: 2.0
          raytrace_max_range: 2.0
          min_obstacle_height: 0.05
          max_obstacle_height: 1.0
          marking: true
          clearing: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.40
        cost_scaling_factor: 3.0


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true

      footprint: "[[0.35, 0.20], [0.35, -0.20], [-0.35, -0.20], [-0.35, 0.20]]"
      footprint_padding: 0.05

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # rtabmap's occupancy grid, not a map_server. Grid/3D is false in
        # rtabmap.yaml specifically so this layer has something to consume.
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: pointcloud
        pointcloud:
          topic: /oak_d/points
          data_type: "PointCloud2"
          obstacle_max_range: 2.0
          raytrace_max_range: 2.0
          marking: true
          clearing: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.40
        cost_scaling_factor: 3.0


planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.30
      # A holonomic-ish planner on a skid-steer. Acceptable because the local
      # controller does the work of following the path; revisit if paths turn
      # out to be unfollowable.
      use_astar: false
      allow_unknown: true


behavior_server:
  ros__parameters:
    use_sim_time: false
    # Recoveries publish velocity too, and they publish it through the
    # smoother. Same reasoning as controller_server above.
    enable_stamped_cmd_vel: true
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    # Recovery behaviours are the ones most likely to be actively harmful
    # here: spinning in place on regolith digs the rover in and destroys what
    # little odometry there is. Consider removing spin entirely once there is
    # field data.
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0


velocity_smoother:
  ros__parameters:
    use_sim_time: false
    # The last node in the chain, so this is the one that actually decides
    # what type /cmd_vel_nav carries. The other two matter because the
    # smoother has to be able to read what they send it.
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.2, 0.0, -1.0]
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: /odom
    odom_duration: 0.1
