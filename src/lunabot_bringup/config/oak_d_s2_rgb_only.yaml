# OAK-D S2, RGB only. No stereo, no depth, no point cloud.
#
# For camera calibration, bandwidth triage, and checking the camera works at
# all. Nothing in the autonomy stack runs against this profile -- SLAM and
# perception both need depth.

/**:
  ros__parameters:
    i_mx_id: ''
    i_usb_speed: 'SUPER'

    camera:
      i_nn_type: 'none'
      i_enable_imu: true
      i_enable_ir: false
      i_tf_tf_prefix: 'oak_d'
      i_publish_tf_from_calibration: false

    imu:
      i_acc_freq: 400
      i_gyro_freq: 400
      i_batch_report_threshold: 1
      i_max_batch_reports: 10

    rgb:
      i_publish_topic: true
      # Full resolution is affordable here because nothing else is competing
      # for USB bandwidth in this profile.
      i_resolution: '1080P'
      i_fps: 30.0
      i_interleaved: false
      i_keep_preview_aspect_ratio: true

    stereo:
      i_publish_topic: false

    pointcloud:
      i_enable: false
