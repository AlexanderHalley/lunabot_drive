# Nav2 parameters for the Lunabot rover.
#
# ==================== UNTUNED ====================
# `nav:=true` starts this stack, and the frame names, the footprint and the
# velocity limits agree with the rest of the workspace -- lunabot_navigation's
# tests enforce that rather than trusting the comments below.
#
# What has NOT happened is a rover navigating anywhere. Nothing here has been
# tuned against a real costmap or a real path. Expect to spend real time on
# the controller and the costmaps. See docs/NAVIGATION.md for the first-run
# checklist and the order to attack the tuning in.
# =================================================
#
# Every ros__parameters block below states `use_sim_time`, including the ones
# where it looks redundant. navigation.launch.py rewrites the value through
# nav2_common's RewrittenYaml, which REPLACES existing keys and does not add
# missing ones -- a block without the key silently keeps the wall clock under
# hw:=sim.
#
# The parts most likely to need rethinking for this robot:
#
#   - The rover is SKID-STEER with fabricated odometry (no encoders). Nav2's
#     controllers assume the robot goes where it is told. It does not.
#   - The only obstacle sensor is a camera clipped at 2 m and tilted down.
#     The costmap's observation range cannot exceed what the sensor measures.
#   - Regolith traversability is not a binary. A slope the rover can climb
#     empty may be impassable loaded.

amcl:
  ros__parameters:
    # Present for completeness only. The rover localises with SLAM
    # (rtabmap owns map -> odom), not AMCL against a static map. Running both
    # would put two publishers on map -> odom.
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan


bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    # ms a server gets to ACKNOWLEDGE a request before the tree gives up on
    # the whole goal. Nav2's 20 ms default aborted the first sim goal mid-
    # drive ("Timed out while waiting for action server to acknowledge goal
    # request for compute_path_to_pose") with Isaac and rtabmap loading the
    # CPU; so did 200 ms, for follow_path (load 12 on 16 threads). A Jetson
    # under SLAM load is no better. The only cost of 1 s is noticing a dead
    # server a second later.
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    # The *_car_like.xml trees: replan only when the path goes invalid, and
    # no Spin recovery. BOTH must be set: bt_navigator loads the
    # through-poses tree at configure too, and Nav2's default calls Spin,
    # which no longer exists -- Nav2 then fails to come up at all.
    # The values are placeholders: navigation.launch.py rewrites them to the
    # installed absolute paths.
    default_nav_to_pose_bt_xml: "navigate_car_like.xml"
    default_nav_through_poses_bt_xml: "navigate_through_poses_car_like.xml"


controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0

    # TwistStamped, not Twist. twist_mux runs with use_stamped: true because
    # Jazzy's diff_drive_controller subscribes to TwistStamped, and a mismatch
    # here is the failure docs/TOPIC_FRAME_CONTRACT.md warns about: the topics
    # connect, nothing errors, and the rover does not move.
    #
    # VERIFY against the installed Nav2. This parameter arrived in Jazzy and
    # is expected to disappear again once stamped commands are the only
    # option.
    enable_stamped_cmd_vel: true

    # Anything below this counts as stopped. Set generously because a
    # skid-steer scrubbing on regolith reports motion it is not making.
    min_x_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.10

    # A K-turn stops at every cusp, so "no progress for 10 s" (the default)
    # trips mid-manoeuvre.
    progress_checker_plugins: ["progress_checker"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0

    # Loose on yaw: the rover cannot correct heading in place, so a tight yaw
    # tolerance means a K-turn at every goal. The planner already arrives
    # close to the goal heading.
    goal_checker_plugins: ["goal_checker"]
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.5
      stateful: true

    # Nav2's output. twist_mux arbitrates between this and teleop, and teleop
    # wins -- see lunabot_bringup/config/twist_mux.yaml.
    controller_plugins: ["FollowPath"]

    FollowPath:
      # Regulated Pure Pursuit: follow the Hybrid-A* path, forwards AND
      # backwards. The rover cannot turn on the spot in sand (2026 field fact,
      # modelled in lunabot_sim/robot/soil.py), so it is driven like a car:
      # the planner bakes the turning radius into the path, and this only
      # tracks it.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # The 2027 design's top speed. MUST stay within diff_drive_controller's
      # limits in lunabot_bringup/config/controllers.yaml, and equal to the
      # smoother's below (tests enforce both).
      desired_linear_vel: 0.3

      # Pure pursuit steers at a point this far down the path. Too short and
      # it chases curvature the rover cannot achieve; too long and it cuts
      # corners into obstacles.
      lookahead_dist: 0.8
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.5
      lookahead_time: 2.0
      use_velocity_scaled_lookahead_dist: true

      # NEVER turn in place: it digs the wheels in instead. allow_reversing
      # follows the cusps of a Reeds-Shepp path, and Nav2 refuses it unless
      # rotate-to-heading is off.
      use_rotate_to_heading: false
      allow_reversing: true
      rotate_to_heading_angular_vel: 0.5  # unused while the above is false
      max_angular_accel: 2.0

      # Slow down where the path bends tighter than the rover can turn, so it
      # scrubs through rather than ploughing on. Same radius as the planner's
      # minimum_turning_radius (tested).
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.5
      regulated_linear_scaling_min_speed: 0.10
      use_cost_regulated_linear_velocity_scaling: false

      # Above min_x_velocity_threshold, or the last few cm never happen.
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.6

      use_collision_detection: true
      # Seconds of the commanded arc that must be clear. The arc is straight-
      # ish while the rover is still turning onto a curving path, so a long
      # horizon sees obstacles the path itself steers clear of.
      max_allowed_time_to_collision_up_to_carrot: 1.0
      transform_tolerance: 0.2
      interpolate_curvature_after_goal: false


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true

      # 4 m window with a 2 m sensor. Deliberately larger than the sensor
      # range so the rover retains a short memory of obstacles that have
      # passed out of view -- which matters when the only camera faces
      # forward and the rover reverses.
      width: 4
      height: 4
      resolution: 0.05

      # From properties.xacro: the box that holds the chassis AND the wheels,
      # whichever reaches further (here the wheels: axle +- wheel_base/2 plus
      # a radius, and track/2 plus half a wheel width). Update together; a
      # footprint smaller than the robot is how rovers get wedged. The 2027
      # design's drum reaches further forward still -- grow this when the
      # description models it.
      footprint: "[[0.46, 0.322], [0.46, -0.322], [-0.46, -0.322], [-0.46, 0.322]]"
      footprint_padding: 0.05

      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        observation_sources: pointcloud
        pointcloud:
          topic: /oak_d/points
          data_type: "PointCloud2"
          # Both bounded by the camera's 2 m depth clip. Claiming more range
          # than the sensor has means clearing space that was never observed.
          obstacle_max_range: 2.0
          raytrace_max_range: 2.0
          min_obstacle_height: 0.05
          max_obstacle_height: 1.0
          marking: true
          clearing: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.40
        cost_scaling_factor: 3.0


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true

      # A ROLLING window, not one sized by the static layer. Sized by
      # rtabmap's /map, the costmap only covers what the camera has seen --
      # about 2 m at the start -- and a goal across the arena is rejected as
      # GOAL_OUTSIDE_MAP (planner error 204) before anything is planned. 16 m
      # covers a whole competition arena (8.14 m x 4.57 m UCF lane) from
      # anywhere inside it; the static layer still copies rtabmap's map in.
      rolling_window: true
      width: 16
      height: 16

      footprint: "[[0.46, 0.322], [0.46, -0.322], [-0.46, -0.322], [-0.46, 0.322]]"
      footprint_padding: 0.05

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # rtabmap's occupancy grid, not a map_server. Grid/3D is false in
        # rtabmap.yaml specifically so this layer has something to consume.
        map_subscribe_transient_local: true

      obstacle_layer:
        # VOXEL, not the 2D ObstacleLayer. The camera looks DOWN over a
        # low boulder at the ground behind it; in 2D the clearing ray to
        # each of those ground points runs through the boulder's cell and
        # erases it. The global costmap then held no obstacles at all and
        # the planner drove straight at the rock (only rtabmap's /map, via
        # the static layer, had been hiding that). Same as local_costmap.
        plugin: "nav2_costmap_2d::VoxelLayer"
        observation_sources: pointcloud
        pointcloud:
          topic: /oak_d/points
          data_type: "PointCloud2"
          obstacle_max_range: 2.0
          raytrace_max_range: 2.0
          min_obstacle_height: 0.05
          max_obstacle_height: 1.0
          marking: true
          clearing: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # >= the padded footprint's circumscribed radius (0.63 m), which
        # lets Smac collision-check by centre cost and only fall back to the
        # full footprint near obstacles. Well beyond it, so cost keeps
        # falling off past the footprint and Hybrid-A* leaves room: a rover
        # that cannot turn quickly lags its path, and a path that grazes the
        # inscribed zone has the follower stop for "collision ahead".
        inflation_radius: 1.0
        cost_scaling_factor: 3.0


planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      # Hybrid-A* with Reeds-Shepp motion: paths a car-like rover can drive,
      # including reversing and K-turns. Navfn planned holonomic paths and left
      # the controller to find turns the rover cannot make.
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      motion_model_for_search: "REEDS_SHEPP"

      # The tightest arc the rover actually achieves in sand. ASSUMED 1.5 m
      # (unmeasured; Isaac's sand model is calibrated to the same number --
      # lunabot_sim/robot/soil.py). Smaller than reality gives paths the rover
      # cannot follow; larger wastes the arena.
      minimum_turning_radius: 1.5

      # Reversing costs more than driving forward. Not prohibitive: reversing
      # is how this rover turns round. But the only camera faces forward, so
      # every reverse leg runs into space the costmaps have never seen -- in
      # the walled arena that meant backing into the wall behind the start.
      # Lower it again once the rear D455 is fitted.
      reverse_penalty: 2.5
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 3.0
      retrospective_penalty: 0.015

      tolerance: 0.30
      allow_unknown: true
      downsample_costmap: false
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      debug_visualizations: false

      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2


behavior_server:
  ros__parameters:
    use_sim_time: false
    # Recoveries publish velocity too, and they publish it through the
    # smoother. Same reasoning as controller_server above.
    enable_stamped_cmd_vel: true
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    # No spin. The rover cannot turn on the spot in sand -- it digs in -- so
    # a spin recovery only buries the wheels. navigate_car_like.xml does not
    # call one either (tested).
    behavior_plugins: ["backup", "wait"]
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"


velocity_smoother:
  ros__parameters:
    use_sim_time: false
    # The last node in the chain, so this is the one that actually decides
    # what type /cmd_vel_nav carries. The other two matter because the
    # smoother has to be able to read what they send it.
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    feedback: "OPEN_LOOP"
    # Symmetric in x: Regulated Pure Pursuit reverses at its forward speed,
    # and a lower reverse cap here would change the curvature of every
    # reverse leg (angular is computed for the uncapped speed).
    max_velocity: [0.3, 0.0, 1.0]
    min_velocity: [-0.3, 0.0, -1.0]
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: /odom
    odom_duration: 0.1


curvature_limiter:
  ros__parameters:
    use_sim_time: false
    # The tightest radius COMMANDED. Not the planner's 1.5 m: a commanded arc
    # comes out wider in sand (Isaac: commanded 1.0 m drives ~1.5 m), and
    # below ~0.5 m commanded the rover stalls with its wheels spinning --
    # which is what this node exists to prevent. See
    # scripts/curvature_limiter.py.
    min_turning_radius: 1.0
