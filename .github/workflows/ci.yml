name: CI

on:
  push:
    branches: [main, develop-2027]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ROS_DISTRO: jazzy
  # Source-built dependencies, imported by vcs from lunabot.repos. Must match
  # that file -- they are the same list wearing different hats.
  #
  # isaac_ros_visual_slam is skipped for a different reason, and permanently:
  # it is not in the Jazzy distribution at all -- no isaac_ros_* package is in
  # the index rosdep resolves against. Requiring it would fail every build to
  # get a node that cannot be installed. See docs/SLAM.md.
  ROSDEP_SKIP_KEYS: "sparkcan isaac_ros_visual_slam"

jobs:
  # ---------------------------------------------------------------------------
  # Cheap and fast. Runs first so a formatting mistake does not wait on a
  # full colcon build.
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pre-commit/action@v3.0.1

  # ---------------------------------------------------------------------------
  # No ROS needed: expand the xacro for every hardware target and check the
  # result is a valid URDF. Catches the most common breakage in the
  # description package in about thirty seconds.
  # ---------------------------------------------------------------------------
  urdf:
    name: urdf
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4

      - name: Install xacro and liburdfdom-tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ros-jazzy-xacro liburdfdom-tools

      - name: Expand and validate for every hardware target
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash

          # lunabot.urdf.xacro pulls in six files via $(find
          # lunabot_description), which resolves through the ament index --
          # so the package has to be ON that index or xacro fails before it
          # parses a single tag. Rather than build the workspace for what is a
          # syntax check, fake the smallest prefix ament will accept: a marker
          # file and a symlink to the source tree.
          #
          # Setting AMENT_PREFIX_PATH in the job's env: block does not work.
          # setup.bash above overwrites it, so the export has to come after.
          shim=/tmp/ament_shim
          mkdir -p "$shim/share/ament_index/resource_index/packages"
          touch "$shim/share/ament_index/resource_index/packages/lunabot_description"
          ln -sfn "$PWD/src/lunabot_description" "$shim/share/lunabot_description"
          export AMENT_PREFIX_PATH="$shim:$AMENT_PREFIX_PATH"

          for hw in real mock sim; do
            echo "::group::hardware:=$hw"
            xacro src/lunabot_description/urdf/lunabot.urdf.xacro \
              hardware:=$hw > /tmp/lunabot_$hw.urdf
            check_urdf /tmp/lunabot_$hw.urdf
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # The main job. Builds every package -- including lunabot_hardware against
  # a source build of sparkcan, so the CAN plugin is genuinely compiled here
  # rather than only on someone's laptop -- and runs every test.
  #
  # That includes test_mock_bringup, which brings the whole stack up on mock
  # hardware and drives it, and test_sim_bringup, which does the same on
  # hw:=sim against a stand-in for Isaac's bridge graphs. Headless, no
  # hardware, no GPU. They are the highest value things in this file.
  #
  # test_sim_bringup needs topic_based_ros2_control, which comes from
  # lunabot.repos via the vcs-repo-file-url below. It builds because
  # lunabot_bringup declares it as an exec_depend -- imported and depended on
  # by nothing, colcon has no reason to build it.
  # ---------------------------------------------------------------------------
  build-test:
    name: build and test
    runs-on: ubuntu-24.04
    # The official image rather than setup-ros on a bare runner. setup-ros
    # produced an install where find_package(rclcpp) succeeded but the ament
    # RESOURCE INDEX had no typesupport registered, so every C++ package died
    # at configure time with "No 'rosidl_typesupport_c' found". Those two
    # lookups read different variables -- CMAKE_PREFIX_PATH and
    # AMENT_PREFIX_PATH -- which is why the failure looked like a code problem
    # and was not one.
    #
    # The urdf job above already builds against this image, so it is a known
    # quantity here. It is also minutes faster, because ROS is baked in rather
    # than apt-installed on every run.
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4

      # The image is deliberately lean. action-ros-ci shells out to all of
      # these, and runs `sudo` even as root, which the image does not ship.
      # After the tests it also runs `colcon lcov-result` and `colcon
      # coveragepy-result`: without those two verbs the job failed with every
      # test passed ("invalid choice: 'lcov-result'").
      - name: Tools action-ros-ci expects
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            sudo python3-colcon-common-extensions python3-rosdep python3-vcstool \
            python3-colcon-lcov-result python3-colcon-coveragepy-result lcov

      # Cheap, and it makes the next failure self-explanatory rather than
      # another round of guessing. If the resource index below is empty, the
      # ROS install is incomplete and nothing in this repository can fix it.
      - name: Sanity-check the ROS install
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          echo "AMENT_PREFIX_PATH=$AMENT_PREFIX_PATH"
          echo "::group::rosidl_typesupport_c providers"
          ls /opt/ros/jazzy/share/ament_index/resource_index/rosidl_typesupport_c/
          echo "::endgroup::"

      - uses: ros-tooling/action-ros-ci@v0.3
        with:
          target-ros2-distro: jazzy
          package-name: |
            lunabot_msgs
            lunabot_description
            lunabot_hardware
            lunabot_bringup
            lunabot_perception
            lunabot_slam
            lunabot_navigation
            lunabot_excavation
            lunabot_sim
          vcs-repo-file-url: ${{ github.workspace }}/lunabot.repos
          skip-tests: false
          colcon-defaults: |
            {
              "build": {
                "cmake-args": ["-DCMAKE_BUILD_TYPE=RelWithDebInfo"]
              }
            }
        env:
          ROSDEP_SKIP_KEYS: ${{ env.ROSDEP_SKIP_KEYS }}

      # ros2_control is NOT in the base image -- rosdep installs it during the
      # step above -- so this has to come after it. Putting it first killed a
      # whole run: the header did not exist yet, and under `bash -e` the failed
      # grep took the job down before it compiled anything.
      #
      # ResourceManager's API has moved twice inside Jazzy now. A compile error
      # names the member that vanished but never the one that replaced it, so
      # when lunabot_hardware fails to build this is what says why. Nothing
      # here may fail the job.
      - name: ResourceManager API this image ships
        if: always()
        shell: bash
        run: |
          header=/opt/ros/jazzy/include/hardware_interface/hardware_interface/resource_manager.hpp
          if [ -f "$header" ]; then
            echo "::group::$header"
            grep -n 'load\|initialize\|urdf\|explicit ResourceManager' "$header" | head -60 || true
            echo "::endgroup::"
          else
            echo "$header is not installed"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-test-results
          path: |
            ros_ws/log/latest_test/
            ros_ws/build/*/test_results/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Isaac Sim is NEVER run in CI -- it needs a GPU and a large licensed image.
  # What is testable here is the scene layout, which is pure numpy: seeded
  # determinism, arena bounds, start-zone exclusion, minimum separation. That
  # separation is exactly why scene/boulders.py imports no Isaac.
  # ---------------------------------------------------------------------------
  sim-layout:
    name: sim scene layout
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pytest pyyaml

      - name: Scene layout tests
        working-directory: src/lunabot_sim
        run: PYTHONPATH=. python -m pytest test/test_scene_layout.py -v

      - name: Isaac API probe inventory
        working-directory: src/lunabot_sim
        # Parses graphs/*.py with ast and fails if the probe's list of
        # OmniGraph node types drifts from what the code creates. Isaac-free
        # by construction, so it belongs in this job rather than the colcon
        # one -- and running it standalone proves it stays that way.
        run: PYTHONPATH=. python -m pytest test/test_probe.py -v

      - name: Config file tests
        working-directory: src/lunabot_bringup
        # Runs standalone as well as under colcon: it is pure YAML parsing,
        # and it guards the trap where 1.0e6 silently becomes a string.
        run: python -m pytest test/test_config_files.py -v

      - name: Nav2 parameter tests
        working-directory: src/lunabot_navigation
        # Also standalone-safe, and for the same reason: it reads YAML and one
        # xacro property with a regex, and never imports Nav2. It checks the
        # values nav2_params.yaml restates from other packages -- footprint,
        # velocity limits, observation ranges, stamped commands.
        run: python -m pytest test/test_nav2_params.py -v

  # ---------------------------------------------------------------------------
  # The deployable image (docker/Dockerfile.robot), built natively for both
  # architectures: arm64 is the Jetson Orin, amd64 is the desktop that runs the
  # same image against Isaac. ubuntu-24.04-arm is a free GitHub-hosted runner
  # for public repositories -- no QEMU, so the arm64 build is not emulated.
  #
  # The smoke test runs the MOCK stack from inside the image and drives it with
  # check_stack.py --drive: it proves the install tree stands alone (no source,
  # no symlinks) and that every runtime dependency made it in. The colcon job
  # above tests the code; this tests the packaging.
  #
  # Pushes to develop-2027 publish ghcr.io/<owner>/lunabot_drive/robot:
  #   :<sha>-<arch>, :develop-2027-<arch>, and (robot-image-manifest) the
  #   multi-arch :<sha> and :develop-2027 the rover pulls. docs/DEPLOYMENT.md.
  # ---------------------------------------------------------------------------
  robot-image:
    name: robot image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/alexanderhalley/lunabot_drive/robot
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.robot
          target: runtime
          load: true
          tags: lunabot/robot:ci
          build-args: GIT_SHA=${{ github.sha }}
          # Per-architecture cache: the apt + rosdep layer is most of the
          # build and only changes when a package.xml or lunabot.repos does.
          cache-from: type=gha,scope=robot-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=robot-${{ matrix.arch }}

      - name: Smoke test -- mock stack from the image, driven
        run: |
          # set -m: without job control bash starts background jobs with
          # SIGINT IGNORED, Python keeps that, and the launch never stops.
          docker run --rm lunabot/robot:ci bash -c '
            set -m
            ros2 launch lunabot_bringup robot.launch.py hw:=mock > /tmp/launch.log 2>&1 &
            sleep 25
            ros2 run lunabot_bringup check_stack.py --profile mock --drive
            rc=$?
            if [ $rc -ne 0 ]; then echo "--- launch log ---"; tail -80 /tmp/launch.log; fi
            kill -INT %1; wait
            exit $rc'

      - name: Image size
        run: docker image ls lunabot/robot:ci

      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop-2027'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in "${{ github.sha }}-${{ matrix.arch }}" "develop-2027-${{ matrix.arch }}"; do
            docker tag lunabot/robot:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done

  robot-image-manifest:
    name: robot image (multi-arch tags)
    needs: robot-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop-2027'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/alexanderhalley/lunabot_drive/robot
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: One tag, both architectures
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:develop-2027" \
            "$IMAGE:${{ github.sha }}-amd64" "$IMAGE:${{ github.sha }}-arm64"
          docker buildx imagetools inspect "$IMAGE:${{ github.sha }}"
