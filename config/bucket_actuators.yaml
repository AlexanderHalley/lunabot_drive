bucket:
  lift:
    actuator_driver:
      ros__parameters:
        actuator_name: "lift"
        rpwm_gpio: 12
        lpwm_gpio: 18
        en_gpio: 5
        pwm_frequency: 10000
        max_speed_pct: 100
        watchdog_timeout_s: 2.0
        max_continuous_run_s: 15.0
        cooldown_time_s: 45.0
        invert_direction: false

  tilt:
    actuator_driver:
      ros__parameters:
        actuator_name: "tilt"
        rpwm_gpio: 13
        lpwm_gpio: 19
        en_gpio: 6
        pwm_frequency: 10000
        max_speed_pct: 100
        watchdog_timeout_s: 2.0
        max_continuous_run_s: 15.0
        cooldown_time_s: 45.0
        invert_direction: false
