repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # xacro/URDF are XML, and launch YAML sometimes uses tags check-yaml
        # rejects. Only lint the config we actually hand-write.
        files: \.(yaml|yml)$
        exclude: ^src/.*/urdf/
      - id: check-xml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]

  # Configured by ruff.toml at the repo root -- 99 columns and single quotes,
  # to match ament_flake8 rather than ruff's own defaults. Without that file
  # this hook and `colcon test` disagree about every Python file in the tree.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        # QUOTED, and it matters: a YAML flow sequence splits on commas, so
        # the unquoted form passed --ignore-words-list=ist and then handed
        # `inout`, `nd` and `te` to codespell as filenames. Only the first
        # word in the list was ever ignored.
        #
        # assertin: the unittest method assertIn, not a typo.
        # tread: what a wheel has. Not "thread".
        args: ['--ignore-words-list=ist,inout,nd,te,assertin,tread']
