# Controller configuration. Loaded identically for mock, sim and real hardware
# -- that is the point of the whole design, so resist the urge to add a
# hardware-specific variant of this file.

controller_manager:
  ros__parameters:
    # 100 Hz. Two things depend on this number:
    #
    #   1. The SparkFlex controllers need a heartbeat at least every ~50 ms or
    #      they fault out. controller_manager calls write() every 10 ms
    #      whenever the hardware component is active, independent of whether
    #      any controller is running, so the heartbeat comes for free. Do not
    #      drop this below 40 Hz without re-reading
    #      lunabot_hardware/src/spark_flex_system.cpp.
    #
    #   2. Under sim time this rate is measured against Isaac's clock. If
    #      Isaac's real-time factor drops below ~0.3, teleop becomes unusable.
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController


diff_drive_controller:
  ros__parameters:
    # 4WD skid-steer driven as a differential: each side's two wheels get the
    # same velocity command, and odometry averages each side's feedback.
    #
    # These strings must match the joint names in
    # lunabot_description/urdf/lunabot.urdf.xacro exactly.
    left_wheel_names: [front_left_wheel_joint, rear_left_wheel_joint]
    right_wheel_names: [front_right_wheel_joint, rear_right_wheel_joint]

    # ======================= MEASURE THESE =======================
    # PLACEHOLDERS. Both are duplicated in
    # lunabot_description/urdf/common/properties.xacro, where the geometry
    # lives. xacro cannot reach into this file, so the duplication cannot be
    # designed away.
    #
    # If these two disagree with the URDF, odometry is wrong and nothing
    # reports it: no error, no warning, just a robot that believes it
    # travelled a different distance than it did. Change one, change the
    # other, same commit.
    wheel_separation: 0.50
    wheel_radius: 0.10
    # =============================================================

    # Skid-steer correction. A skid-steer rover's EFFECTIVE track width during
    # a turn is wider than its geometric one, because the wheels scrub rather
    # than roll. Without this, commanded yaw rate and actual yaw rate diverge
    # and every map comes out rotated.
    #
    # TUNE ON REGOLITH, not on a workshop floor -- the value depends on the
    # surface. Expect somewhere between 1.3 and 2.0. Procedure: command a
    # known yaw rate, measure the actual rotation over ten seconds, scale.
    wheel_separation_multiplier: 1.5

    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link

    # This controller owns odom -> base_link by default. Exactly one node may
    # publish that transform; lunabot_bringup/launch/robot.launch.py flips
    # this to false when odom_source:=visual or odom_source:=ekf.
    # See docs/TOPIC_FRAME_CONTRACT.md.
    enable_odom_tf: true

    # Use wheel feedback rather than integrating the command.
    #
    # CAVEAT ON REAL HARDWARE: with use_motor_feedback:=false in the hardware
    # interface (the current state -- no encoders), read() echoes the command
    # back, so "feedback" is the command and this is open_loop in all but
    # name. The setting is still correct: it means the moment encoders exist,
    # odometry becomes real without touching this file.
    open_loop: false
    position_feedback: true

    # Matches the 500 ms watchdog the 2026 drive node enforced by hand.
    cmd_vel_timeout: 0.5

    # Diagonal only. Written as plain decimals rather than 1.0e6: under
    # YAML 1.1 an exponent without a sign parses as a STRING, and the
    # controller then rejects the parameter at load.
    #
    # Large values on the unobservable axes (y, z, roll, pitch)
    # tell the EKF and rtabmap not to trust them at all -- a planar rover has
    # no information about those, and claiming otherwise makes fusion worse
    # than not fusing.
    #                          x     y      z    roll  pitch  yaw
    pose_covariance_diagonal: [0.05, 0.05, 1000000.0, 1000000.0, 1000000.0, 0.1]
    twist_covariance_diagonal: [0.05, 0.05, 1000000.0, 1000000.0, 1000000.0, 0.1]

    # PLACEHOLDERS, and deliberately conservative. The acceleration limits
    # matter more than the velocity ones on a skid-steer: a step command
    # breaks traction, and a rover that has broken traction is a rover whose
    # odometry is fiction.
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    linear.x.max_acceleration: 1.0
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true

    angular.z.max_velocity: 2.0
    angular.z.min_velocity: -2.0
    angular.z.max_acceleration: 2.0
    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true


# ==================== joint_state_broadcaster has NO SECTION ====================
# Deliberately. It wants to publish every state interface the hardware exports,
# which is what robot_state_publisher needs to build the TF tree, and that is
# already the controller's default: `joints` and `interfaces` both default to
# an empty list, and an empty list means "everything".
#
# Saying so explicitly is what you cannot do. This file used to carry
#
#     joint_state_broadcaster:
#       ros__parameters:
#         joints: []
#
# and an empty YAML sequence in a ROS 2 parameter file carries NO ELEMENT TYPE,
# so the parser cannot build a value for it and leaves the parameter unset.
# The controller then refuses to initialize:
#
#     Caught exception of type InvalidParameterValueException while
#     initializing controller 'joint_state_broadcaster': parameter_value_from
#     failed for parameter 'joints': No parameter value set
#
# which the spawner reports only as "Failed loading controller
# joint_state_broadcaster" -- so /joint_states never appears, and with it no
# TF for the wheels and no odometry. Writing the default down cost the entire
# control stack.
#
# This is the same class of trap as the YAML 1.1 exponent one further up:
# something that reads as a value and is not. test_config_files.py fails on
# any empty list in this directory.
# ===============================================================================
